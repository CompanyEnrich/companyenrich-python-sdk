[project]
name = "companyenrich"
version = "1.0.0"
description = "Official Python SDK for the CompanyEnrich API: company and people enrichment, search, lookalikes, and work emails."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["companyenrich", "company-data", "enrichment", "people-search", "company-search", "lookalike", "b2b-data", "api", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1", "typing-extensions>=4.10"]

[project.urls]
Homepage = "https://companyenrich.com"
Repository = "https://github.com/CompanyEnrich/companyenrich-python-sdk"
Issues = "https://github.com/CompanyEnrich/companyenrich-python-sdk/issues"

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1", "mypy>=2", "ruff>=0.17", "datamodel-code-generator>=0.91"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companyenrich"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
# Responses are unvalidated JSON typed by the declared return type of each method.
warn_return_any = false

[tool.ruff]
line-length = 100
src = ["src"]
extend-exclude = ["src/companyenrich/_generated.py", "src/companyenrich/_sync", "tests/_sync"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
combine-as-imports = true
